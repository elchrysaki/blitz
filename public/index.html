<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#032A3C">
  <title>Blitz — live quizzes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF5A1F'/%3E%3Cpath d='M18 5 9 18h6l-1 9 9-13h-6z' fill='%23032A3C'/%3E%3C/svg%3E">
  <link rel="preload" href="/app.js" as="script">
  <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Paints before the stylesheet or script arrive, so the screen is never blank white. */
    html { background: #032A3C; color: #F6F1E9; }
    .boot { min-height: 100vh; display: grid; place-items: center; font: 800 28px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.03em; }
    .boot i { color: #FF5A1F; font-style: normal; }
  </style>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div id="app"><div class="boot">blitz<i>.</i></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
