<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#032A3C">
  <title>Blitz — live quizzes</title>
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/mark-180.png">
  <link rel="preload" href="/app.js" as="script">
  <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Paints before the stylesheet or script arrive, so the screen is never blank white. */
    html { background: #032A3C; color: #F6F1E9; }
    .boot { min-height: 100vh; display: grid; place-items: center; font: 800 28px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.03em; }
    .boot i { color: #FF5A1F; font-style: normal; }
    .boot span { display: inline-flex; align-items: center; gap: 10px; }
  </style>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div id="app"><div class="boot"><span><img src="/brand/mark.svg" alt="" width="40" height="40">blitz<i>.</i></span></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
